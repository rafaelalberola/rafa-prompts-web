name: Precio Switch

# Switch atómico del precio del curso "El método Claude".
# - HTML: reemplaza literales de precio (149 → 197).
# - Worker Cloudflare: actualiza STRIPE_PRICE_ID y redespliega.
# - Auto-deploy del sitio estático: vía push a main (Cloudflare Pages).
#
# Idempotente: si los HTML ya tienen el precio nuevo, hace noop.
# Reusable: cron + dispatch manual con override de inputs.

on:
  schedule:
    # Domingo 21:50 UTC = 23:50 CEST (Madrid en mayo, UTC+2).
    # GitHub puede retrasar el cron hasta ~15 min en horas pico.
    # Margen elegido para que ejecute antes de medianoche Madrid.
    - cron: '50 21 4 5 *'
  workflow_dispatch:
    inputs:
      from_price:
        description: 'Precio actual (sin €)'
        default: '149'
        required: true
      to_price:
        description: 'Precio nuevo (sin €)'
        default: '197'
        required: true
      old_price_id:
        description: 'Stripe price ID actual'
        default: 'price_1TQPLuIYM3GXrMLHqFxUdIrT'
        required: true
      new_price_id:
        description: 'Stripe price ID nuevo (price_XXXX)'
        required: true
      dry_run:
        description: 'Dry run (sin commit/push/deploy)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: precio-switch
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ubuntu-latest
    env:
      FROM:         ${{ inputs.from_price    || vars.PRECIO_FROM     || '149' }}
      TO:           ${{ inputs.to_price      || vars.PRECIO_TO       || '197' }}
      OLD_PRICE_ID: ${{ inputs.old_price_id  || vars.OLD_PRICE_ID    || 'price_1TQPLuIYM3GXrMLHqFxUdIrT' }}
      NEW_PRICE_ID: ${{ inputs.new_price_id  || vars.NEW_PRICE_ID }}
      DRY_RUN:      ${{ inputs.dry_run       || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate inputs
        run: |
          set -e
          if [ -z "$NEW_PRICE_ID" ]; then
            echo "::error::NEW_PRICE_ID vacío. Configura repo variable NEW_PRICE_ID o pásalo en workflow_dispatch."
            exit 1
          fi
          echo "FROM=$FROM TO=$TO"
          echo "OLD_PRICE_ID=$OLD_PRICE_ID"
          echo "NEW_PRICE_ID=$NEW_PRICE_ID"
          echo "DRY_RUN=$DRY_RUN"

      - name: Idempotency check (¿ya está aplicado?)
        id: idempotency
        run: |
          set -e
          # Cuenta ocurrencias del precio FROM en HTML root y wrangler.toml.
          # Excluye vender.html y tienda.html (copy psicológico, no tocar).
          COUNT_HTML=$(grep -l "${FROM} €\|${FROM}\.00\|${FROM} euros" \
            $(find . -maxdepth 2 -name "*.html" -type f \
              ! -path "./node_modules/*" \
              ! -name "vender.html" \
              ! -name "tienda.html") 2>/dev/null | wc -l | tr -d ' ')
          COUNT_TOML=$(grep -c "STRIPE_PRICE_ID = \"$OLD_PRICE_ID\"" api/wrangler.toml || echo 0)
          echo "html_files_with_old_price=$COUNT_HTML"
          echo "toml_has_old_price=$COUNT_TOML"
          if [ "$COUNT_HTML" = "0" ] && [ "$COUNT_TOML" = "0" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Precio ya migrado a $TO€. Noop."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Replace prices in HTML
        if: steps.idempotency.outputs.skip != 'true'
        run: |
          set -e
          # Solo HTML en raíz del repo (no subcarpetas como course/, scripts/, etc.)
          for f in *.html; do
            [ -f "$f" ] || continue
            case "$f" in
              vender.html|tienda.html)
                # estos archivos contienen "297" como ejemplo de psicología de precios.
                # Solo reemplazamos los literales del producto si los hay.
                ;;
            esac
            sed -i \
              -e "s/${FROM} €/${TO} €/g" \
              -e "s/${FROM}\\.00/${TO}.00/g" \
              -e "s/${FROM} euros/${TO} euros/g" \
              "$f"
          done

      - name: Update Worker config (wrangler.toml)
        if: steps.idempotency.outputs.skip != 'true'
        run: |
          set -e
          sed -i \
            "s|STRIPE_PRICE_ID = \"$OLD_PRICE_ID\"|STRIPE_PRICE_ID = \"$NEW_PRICE_ID\"|" \
            api/wrangler.toml
          echo "wrangler.toml después:"
          grep STRIPE_PRICE_ID api/wrangler.toml

      - name: Validate (nada del precio antiguo debe quedar)
        if: steps.idempotency.outputs.skip != 'true'
        run: |
          set -e
          LEFTOVER=$(grep -rn "${FROM} €\|${FROM}\.00\|${FROM} euros" \
            --include="*.html" --include="*.toml" . 2>/dev/null \
            | grep -v node_modules \
            | grep -v ".wrangler" \
            | grep -v "vender.html" \
            | grep -v "tienda.html" || true)
          if [ -n "$LEFTOVER" ]; then
            echo "::error::Quedan ocurrencias del precio antiguo:"
            echo "$LEFTOVER"
            exit 1
          fi
          STILL_OLD=$(grep "$OLD_PRICE_ID" api/wrangler.toml || true)
          if [ -n "$STILL_OLD" ]; then
            echo "::error::wrangler.toml aún tiene OLD_PRICE_ID"
            exit 1
          fi
          echo "::notice::Validación OK"

      - name: Diff
        if: steps.idempotency.outputs.skip != 'true'
        run: git diff --stat && echo "---" && git diff | head -200

      - name: Deploy Cloudflare Worker
        if: steps.idempotency.outputs.skip != 'true' && env.DRY_RUN != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: api
          command: deploy

      - name: Commit and push
        if: steps.idempotency.outputs.skip != 'true' && env.DRY_RUN != 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "price: subida ${FROM}€ → ${TO}€ (auto)

          - Worker STRIPE_PRICE_ID: ${OLD_PRICE_ID} → ${NEW_PRICE_ID}
          - HTML CTAs, hero, sticky, OG meta y Pixel events.
          - Meta Ads: rotación automática a copy post-switch (paso siguiente).
          - Triggered by: ${{ github.event_name }} (run #${{ github.run_number }})"
          git push origin main

      - name: Setup Python (for Meta Ads rotation)
        if: steps.idempotency.outputs.skip != 'true' && env.DRY_RUN != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rotate Meta Ads to post-switch copy
        if: steps.idempotency.outputs.skip != 'true' && env.DRY_RUN != 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          set -e
          if [ -z "$META_ACCESS_TOKEN" ]; then
            echo "::warning::META_ACCESS_TOKEN no configurado, saltando rotación de ads"
            exit 0
          fi
          pip install --quiet requests
          python scripts/meta_ads/rotate_metodo_copy.py --mode post-switch || {
            echo "::warning::rotación de ads falló (no bloqueante)"
            exit 0
          }

      - name: Summary
        if: always()
        run: |
          {
            echo "## Precio Switch · run #${{ github.run_number }}"
            echo ""
            echo "- **Trigger:** ${{ github.event_name }}"
            echo "- **From → To:** ${FROM}€ → ${TO}€"
            echo "- **Old price_id:** \`$OLD_PRICE_ID\`"
            echo "- **New price_id:** \`$NEW_PRICE_ID\`"
            echo "- **Dry run:** ${DRY_RUN}"
            echo "- **Skipped (already applied):** ${{ steps.idempotency.outputs.skip }}"
          } >> $GITHUB_STEP_SUMMARY
